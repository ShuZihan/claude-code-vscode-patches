name: Check upstream and release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: claude-code-upstream-release
  cancel-in-progress: false

jobs:
  check-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out patch repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run unit tests
        run: npm test

      - name: Restore the 48-hour check state
        uses: actions/cache/restore@v6
        with:
          path: .upstream-check-state
          key: upstream-check-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            upstream-check-${{ runner.os }}-

      - name: Check the official Marketplace version
        id: upstream
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/check-upstream.mjs --force
          else
            node scripts/check-upstream.mjs
          fi

      - name: Save the new check state
        if: steps.upstream.outputs.due == 'true'
        uses: actions/cache/save@v6
        with:
          path: .upstream-check-state
          key: upstream-check-${{ runner.os }}-${{ github.run_id }}

      - name: Check whether this custom release exists
        if: steps.upstream.outputs.due == 'true'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          CUSTOM_VERSION: ${{ steps.upstream.outputs.custom_version }}
        shell: bash
        run: |
          if gh release view "v${VERSION}-custom.${CUSTOM_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the patched macOS Apple Silicon VSIX
        if: steps.upstream.outputs.due == 'true' && steps.release.outputs.exists == 'false'
        id: build_mac
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          DOWNLOAD_URL: ${{ steps.upstream.outputs.download_url_darwin_arm64 }}
        run: >-
          node scripts/build.mjs
          --download-url "$DOWNLOAD_URL"
          --version "$VERSION"
          --asset-suffix darwin-arm64

      - name: Build the patched Windows x64 VSIX
        if: steps.upstream.outputs.due == 'true' && steps.release.outputs.exists == 'false'
        id: build_windows
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
          DOWNLOAD_URL: ${{ steps.upstream.outputs.download_url_win32_x64 }}
        run: >-
          node scripts/build.mjs
          --download-url "$DOWNLOAD_URL"
          --version "$VERSION"
          --asset-suffix win32-x64

      - name: Publish the custom release
        if: steps.build_mac.outcome == 'success' && steps.build_windows.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build_mac.outputs.version }}
          CUSTOM_VERSION: ${{ steps.upstream.outputs.custom_version }}
          MAC_ASSET_PATH: ${{ steps.build_mac.outputs.asset_path }}
          WINDOWS_ASSET_PATH: ${{ steps.build_windows.outputs.asset_path }}
        shell: bash
        run: |
          gh release create "v${VERSION}-custom.${CUSTOM_VERSION}" "$MAC_ASSET_PATH" "$WINDOWS_ASSET_PATH" \
            --title "Claude Code ${VERSION} custom.${CUSTOM_VERSION}" \
            --notes "Unofficial personal builds generated from the official ${VERSION} darwin-arm64 and win32-x64 VSIX packages. The extension UI identifies itself as a custom build."

      - name: Open one adaptation issue when patching fails
        if: failure() && steps.upstream.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upstream.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          title="Patch adaptation required for Claude Code ${VERSION}"
          count="$(gh issue list --state open --search "${title} in:title" --json number --jq 'length')"
          if [[ "$count" == "0" ]]; then
            gh issue create \
              --title "$title" \
              --body "The deterministic patch anchors did not all match Claude Code ${VERSION}. No VSIX was released. Inspect the failed workflow and adapt only the reported anchors: ${RUN_URL}"
          fi
